<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración ESP32-S3</title>

<style>
body {
    margin: 0;
    padding: 0;

    background:
        linear-gradient(rgba(255,255,255,0.06), rgba(255,255,255,0.06)),
        url("FONDO.jpg");

    background-size: 85%;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    background-color: #000;
    font-family: Arial, sans-serif;
}

.contenedor {
    width: 450px;
    margin: 100px auto;
    padding: 30px;
    text-align: center;

    background: rgba(0, 0, 0, 0.65);
    border-radius: 15px;
    backdrop-filter: blur(6px);

    color: white;
}

button {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn-si {
    background-color: #4CAF50;
    color: white;
}

.btn-si:hover {
    background-color: #43a047;
}

.btn-no {
    background-color: #f44336;
    color: white;
}

.btn-no:hover {
    background-color: #d32f2f;
}

.oculto {
    display: none;
}

.instrucciones {
    margin-top: 20px;
    text-align: left;
}
</style>
</head>

<body>

<div class="contenedor" id="pantalla1">
    <h2>Configuración Inicial</h2>
    <p>¿Estás conectado a la misma red WiFi del sistema?</p>

    <button class="btn-si" onclick="mostrarConectado()">Sí, estoy conectado</button>
    <button class="btn-no" onclick="mostrarNoConectado()">No, no estoy conectado</button>
</div>

<div class="contenedor oculto" id="pantallaConectado">
    <h2>Perfecto ✅</h2>
    <p>Ingresa la IP del ESP32-S3 para continuar:</p>

    <input type="text" placeholder="Ej: 192.168.1.50" style="width:100%; padding:10px; border-radius:8px; border:none;">
    
    <button class="btn-si">Ir al Panel</button>
</div>

<div class="contenedor oculto" id="pantallaNoConectado">
    <h2>Modo Configuración 📡</h2>

    <div class="instrucciones">
        <p>1️⃣ Enciende el ESP32-S3 en modo configuración.</p>
        <p>2️⃣ Conéctate a la red WiFi: <b>ESP32_Config</b></p>
        <p>3️⃣ Abre tu navegador y escribe:</p>
        <p><b>192.168.4.1</b></p>
    </div>

    <button class="btn-si" onclick="volverInicio()">Entendido</button>
</div>

<script>
function mostrarConectado() {
    document.getElementById("pantalla1").classList.add("oculto");
    document.getElementById("pantallaConectado").classList.remove("oculto");
}

function mostrarNoConectado() {
    document.getElementById("pantalla1").classList.add("oculto");
    document.getElementById("pantallaNoConectado").classList.remove("oculto");
}

function volverInicio() {
    document.getElementById("pantallaNoConectado").classList.add("oculto");
    document.getElementById("pantalla1").classList.remove("oculto");
}
</script>

</body>
</html>
