<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración ESP32-S3</title>

<style>
body {
    margin: 0;
    padding: 0;
    background:
        linear-gradient(rgba(255,255,255,0.05), rgba(255,255,255,0.05)),
        url("FONDO.jpg");
    background-size: 85%;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #000;
    font-family: Arial, sans-serif;
    color: white;
}

/* Contenedor principal */
.contenedor {
    width: 450px;
    margin: 120px auto;
    padding: 30px;
    text-align: center;
    background: rgba(0, 0, 0, 0.70);
    border-radius: 15px;
    backdrop-filter: blur(6px);
}

/* Botones */
button {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn-si {
    background-color: #4CAF50;
    color: white;
}

.btn-si:hover {
    background-color: #43a047;
}

.btn-no {
    background-color: #f44336;
    color: white;
}

.btn-no:hover {
    background-color: #d32f2f;
}

/* Ventana emergente */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

.modal-contenido {
    background: #222;
    margin: 15% auto;
    padding: 25px;
    width: 400px;
    border-radius: 12px;
    text-align: center;
}

.cerrar {
    margin-top: 20px;
    background-color: #2196F3;
}
</style>
</head>

<body>

<div class="contenedor">
    <h2>Configuración Inicial</h2>
    <p>¿Estás conectado a la misma red WiFi del sistema?</p>

    <button class="btn-si">Sí, estoy conectado</button>
    <button class="btn-no" onclick="mostrarAviso()">No estoy conectado</button>
</div>

<!-- Ventana Emergente -->
<div id="miModal" class="modal">
  <div class="modal-contenido">
    <h3>⚠ Atención</h3>
    <p>
    Para poder modificar la configuración, tu dispositivo debe estar conectado
    a la misma red WiFi que el ESP32-S3.
    </p>
    <p>
    Esto es necesario porque los cambios se envían directamente al equipo dentro
    de la red local.
    </p>
    <button class="cerrar" onclick="cerrarAviso()">Entendido</button>
  </div>
</div>

<script>
function mostrarAviso() {
    document.getElementById("miModal").style.display = "block";
}

function cerrarAviso() {
    document.getElementById("miModal").style.display = "none";
}
</script>

</body>
</html>
