<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración ESP32-S3</title>

<style>
body {
    margin: 0;
    padding: 0;

    background:
        linear-gradient(rgba(255,255,255,0.05), rgba(255,255,255,0.05)),
        url("FONDO.jpg");

    background-size: 85%;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    background-color: #000;
    font-family: Arial, sans-serif;
    color: white;
}

.contenedor {
    width: 480px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(0, 0, 0, 0.70);
    border-radius: 15px;
    backdrop-filter: blur(6px);
}

h1 {
    text-align: center;
    margin-bottom: 15px;
}

.aviso {
    background: rgba(255, 193, 7, 0.15);
    border-left: 5px solid #ffc107;
    padding: 15px;
    margin-bottom: 25px;
    border-radius: 8px;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    transition: 0.3s;
}

button:hover {
    background-color: #43a047;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>Configuración del Sistema</h1>

<div class="aviso">
⚠ <strong>IMPORTANTE:</strong><br><br>
Para poder realizar cambios en la configuración debes estar conectado a la misma red WiFi del ESP32-S3.<br><br>
Si no estás conectado a la red correcta, los cambios no se aplicarán correctamente.
</div>

<form>

<label>Nombre de Red (SSID)</label>
<input type="text" placeholder="Ej: MiRedWiFi">

<label>Contraseña WiFi</label>
<input type="password" placeholder="Contraseña de la red">

<label>ThingSpeak - Write API Key</label>
<input type="text" placeholder="API Key">

<label>ID Hoja de Cálculo</label>
<input type="text" placeholder="ID del documento">

<button type="submit">Guardar Cambios</button>

</form>

</div>

</body>
</html>
