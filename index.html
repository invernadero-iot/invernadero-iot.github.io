<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página</title>

<style>
body {
    margin: 0;
    padding: 0;

    /* Imagen con leve capa blanca suave */
    background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("FONDO.jpg");

    background-size: 85%;          /* Tamaño regular, no exagerado */
    background-position: center;   /* Centrada */
    background-repeat: no-repeat;  /* No se repite */
    background-attachment: fixed;

    background-color: #000;        /* Fondo negro si sobra espacio */
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

.contenido {
    margin-top: 100px;
}

h1 {
    font-size: 40px;
}

p {
    font-size: 20px;
}
</style>
</head>

<body>

<div class="contenido">
    <h1>Bienvenido</h1>
    <p>Tu página con fondo personalizado</p>
</div>

</body>
</html>
